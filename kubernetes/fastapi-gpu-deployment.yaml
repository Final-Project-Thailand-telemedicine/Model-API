apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-gpu-deployment
  namespace: decubitus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-gpu
  template:
    metadata:
      labels:
        app: fastapi-gpu
    spec:
      containers:
        - name: fastapi-gpu-container
          image: tancoding/decubitus_model:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"   # Request 0.5 CPU cores
              memory: "1Gi" # Request 1GB RAM
              nvidia.com/gpu: 1 # Request 1 GPU
            limits:
              cpu: "2"       # Limit to 2 CPU cores
              memory: "4Gi"  # Limit to 4GB RAM
              nvidia.com/gpu: 1 # Limit to 1 GPU
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/torch/hub/checkpoints
      volumes:
        - name: model-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: decubitus
spec:
  selector:
    app: fastapi-gpu
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
